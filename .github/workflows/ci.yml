# Проверки на каждый PR: линтер, тесты, синхронизация DEPLOY_WORKFLOW_REF, actionlint.
name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions: { contents: read }
concurrency: { group: "ci-${{ github.ref }}", cancel-in-progress: true }

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: { go-version-file: go.mod }
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with: { version: v2.14.0 }

  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: { go-version-file: go.mod }
      - name: Юнит-тесты
        run: go test ./...
      - name: Интеграционные тесты (Postgres через dockertest)
        run: go test -tags integration -count=1 ./internal/itest/...

  # Contract tests against a real Pi of PI_VERSION (FTR.NAB.CMN-0001 qa §1, level K):
  # the RPC client of Pi, the nabu-workspace extension through the relay and the
  # whole engine path (personal turn, task run, service run) with a fake model.
  pi-contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: { go-version-file: go.mod }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: "24" }
      - name: Pi из deploy/versions.env
        run: |
          v=$(sed -n 's/^PI_VERSION=//p' deploy/versions.env)
          npm install -g --no-audit --no-fund "@earendil-works/pi-coding-agent@$v"
          pi --version
      - name: Контрактные тесты
        env: { PIRPC_PI_CMD: pi, NABU_PI_CMD: pi }
        run: |
          go test -count=1 ./pkg/pirpc/ ./internal/platform/agent/... ./internal/relay/ ./internal/workspace/
          go test -tags integration -count=1 -run TestEngineWithPi ./internal/itest/

  # FTR.NAB.CMN-0008, FTR.HMR.CMN-0007: the images of the built-in sandbox
  # profiles build and pass their checks (qa PRF-01…07, PF-01, PF-02). The tools
  # of the profile code are pinned in the Dockerfile and age fast: Trivy finds
  # them here, not at the release.
  sandbox-images:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # Кэш слоёв: без изменений в Dockerfile CI не обращается к snapshot.debian.org, который
      # бывает недоступен (503); кэш пишется после каждого профиля, перезапуск продолжает с него.
      - name: Сборка профиля base
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: sandbox-base
          build-args: VERSION=ci
          tags: nabu-sandbox-base:ci
          load: true
          cache-from: |
            type=gha,scope=sandbox-base
            type=gha,scope=sandbox-documents
            type=gha,scope=sandbox-code
          cache-to: type=gha,mode=max,scope=sandbox-base
      - name: Сборка профиля documents
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: sandbox-documents
          build-args: VERSION=ci
          tags: nabu-sandbox-documents:ci
          load: true
          cache-from: |
            type=gha,scope=sandbox-base
            type=gha,scope=sandbox-documents
            type=gha,scope=sandbox-code
          cache-to: type=gha,mode=max,scope=sandbox-documents
      - name: Сборка профиля code
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: sandbox-code
          build-args: VERSION=ci
          tags: nabu-sandbox-code:ci
          load: true
          cache-from: |
            type=gha,scope=sandbox-base
            type=gha,scope=sandbox-documents
            type=gha,scope=sandbox-code
          cache-to: type=gha,mode=max,scope=sandbox-code
      - name: Проверки профилей
        run: bash sandbox/test.sh nabu-sandbox-base:ci nabu-sandbox-documents:ci nabu-sandbox-code:ci
      - name: CRITICAL и HIGH с исправлением в профиле code
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: nabu-sandbox-code:ci
          version: v0.74.0
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          timeout: 15m
          trivyignores: .trivyignore.yaml

  workflows:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: DEPLOY_WORKFLOW_REF совпадает с uses в release.yml
        run: bash deploy/sync-ref.sh --check
      - name: actionlint
        run: |
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/914e7df21a07ef503a81201c76d2b11c789d3fca/scripts/download-actionlint.bash) 1.7.12
          ./actionlint -color
