# Managed by Hammurapi (FTR.HMR.SPEC-0002): only the version line is updated.
# The check of the tests of service nabu-core against its features in Hammurapi.
name: speclint
on:
  pull_request:
  push:
    branches: ["main"]
permissions: { contents: read, id-token: write }

jobs:
  speclint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: GreenOnGrey/speclint@v2.2.0
        with:
          mode: service
          hammurapi-url: "https://hammurapi-api.greenongrey.tech"
          service: "nabu-core"
