# Release of nabu-core (FTR.NAB.CMN-0001 arch §11, modelled on FTR.HMR.INFRA-0002):
#   push of a tag vX.Y.Z  →  lint ∥ test → build → scan ∥ sandbox-images → deploy (+ checks after the rollout)
#   manual run            →  a rollout of the already built and signed image of the tag, without
#                            a rebuild; with run_id and callback_url, a run under
#                            the rollout contract of FTR.HMR.CMN-0002.
# The repository or organization variable AUTO_DEPLOY=false turns off the rollout on
# a tag (the build, the scan and the publishing go on).
name: release
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      ref: { description: "Tag (vX.Y.Z)", required: true, type: string }
      service: { description: "Contract: nabu-core", required: false, type: string }
      environment: { description: "Contract: environment", required: false, default: production, type: string }
      run_id: { description: "Contract: run_id of Hammurapi", required: false, type: string }
      callback_url: { description: "Contract: address of the result webhook", required: false, type: string }
permissions: { contents: read }

jobs:
  meta:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.m.outputs.tag }}
      image: ${{ steps.m.outputs.image }}
      rebuild: ${{ steps.m.outputs.rebuild }}
      pi_version: ${{ steps.m.outputs.pi_version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: m
        env:
          INPUT_REF: ${{ inputs.ref }}
          INPUT_SERVICE: ${{ inputs.service }}
          EVENT: ${{ github.event_name }}
        run: |
          tag=${INPUT_REF:-$GITHUB_REF_NAME}
          [[ $tag =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::tag '$tag' is not in the format vX.Y.Z"; exit 1; }
          if [[ -n $INPUT_SERVICE && $INPUT_SERVICE != "${GITHUB_REPOSITORY#*/}" ]]; then
            echo "::error::service=$INPUT_SERVICE, while this is ${GITHUB_REPOSITORY#*/}"; exit 1
          fi
          {
            echo "tag=$tag"
            echo "image=ghcr.io/${GITHUB_REPOSITORY,,}"
            # The image is built only on a push of a tag; a manual run rolls out a ready one.
            echo "rebuild=$([[ $EVENT == push ]] && echo true || echo false)"
            echo "pi_version=$(sed -n 's/^PI_VERSION=//p' deploy/versions.env)"
          } >>"$GITHUB_OUTPUT"

  lint:
    needs: meta
    if: needs.meta.outputs.rebuild == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: { go-version-file: go.mod }
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with: { version: v2.14.0 }

  test:
    needs: meta
    if: needs.meta.outputs.rebuild == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: { go-version-file: go.mod }
      - run: go test ./...
      - run: go test -tags integration -count=1 ./internal/itest/...

  build:
    needs: [meta, lint, test]
    runs-on: ubuntu-24.04
    permissions: { contents: read, packages: write, id-token: write, attestations: write }
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: release
          push: true
          sbom: true
          provenance: mode=max
          tags: |
            ${{ needs.meta.outputs.image }}:${{ needs.meta.outputs.tag }}
            ${{ needs.meta.outputs.image }}:sha-${{ github.sha }}
          build-args: |
            VERSION=${{ needs.meta.outputs.tag }}
            PI_VERSION=${{ needs.meta.outputs.pi_version }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign the image (cosign, keyless, GitHub OIDC)
        env: { REF: "${{ needs.meta.outputs.image }}@${{ steps.push.outputs.digest }}" }
        run: cosign sign --yes "$REF"

  # FTR.NAB.CMN-0008: the images of the built-in sandbox profiles with the tag
  # of the release, checked, signed and scanned like nabu-core.
  sandbox-images:
    needs: [meta, lint, test]
    runs-on: ubuntu-24.04
    permissions: { contents: read, packages: write, id-token: write, attestations: write }
    strategy:
      matrix:
        profile: [base, documents, code]
    env:
      IMAGE: ghcr.io/greenongrey/nabu-sandbox-${{ matrix.profile }}
      TRIVY_USERNAME: ${{ github.actor }}
      TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - name: Checks of the profiles before publishing
        run: |
          docker buildx build --load --target sandbox-base --build-arg VERSION=${{ needs.meta.outputs.tag }} -t nabu-sandbox-base:check .
          docker buildx build --load --target sandbox-documents --build-arg VERSION=${{ needs.meta.outputs.tag }} -t nabu-sandbox-documents:check .
          docker buildx build --load --target sandbox-code --build-arg VERSION=${{ needs.meta.outputs.tag }} -t nabu-sandbox-code:check .
          bash sandbox/test.sh nabu-sandbox-base:check nabu-sandbox-documents:check nabu-sandbox-code:check
      - id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: sandbox-${{ matrix.profile }}
          push: true
          sbom: true
          provenance: mode=max
          tags: ${{ env.IMAGE }}:${{ needs.meta.outputs.tag }}
          build-args: VERSION=${{ needs.meta.outputs.tag }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign the image (cosign, keyless, GitHub OIDC)
        env: { REF: "${{ env.IMAGE }}@${{ steps.push.outputs.digest }}" }
        run: cosign sign --yes "$REF"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false, sparse-checkout: .trivyignore.yaml, sparse-checkout-cone-mode: false, path: ignore }
      - name: CRITICAL and HIGH with a fix block the rollout
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: "${{ env.IMAGE }}@${{ steps.push.outputs.digest }}"
          version: v0.74.0
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          trivyignores: ignore/.trivyignore.yaml

  scan:
    needs: [meta, build]
    runs-on: ubuntu-24.04
    permissions: { contents: read, packages: read, security-events: write }
    env:
      REF: ${{ needs.meta.outputs.image }}@${{ needs.build.outputs.digest }}
      TRIVY_USERNAME: ${{ github.actor }}
      TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Report to Code scanning (all vulnerabilities)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with: { image-ref: "${{ env.REF }}", format: sarif, output: trivy.sarif, version: v0.74.0, exit-code: "0" }
      - uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        if: always()
        with: { sarif_file: trivy.sarif, category: trivy-image }
      # Accepted findings with a reason and a deadline are in .trivyignore.yaml (only for the blocking check).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false, sparse-checkout: .trivyignore.yaml, sparse-checkout-cone-mode: false }
      - name: CRITICAL and HIGH with a fix block the rollout
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: "${{ env.REF }}"
          version: v0.74.0
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          skip-setup-trivy: true
          trivyignores: .trivyignore.yaml

  release-notes:
    needs: [meta, build, scan]
    runs-on: ubuntu-24.04
    permissions: { contents: write }
    steps:
      - name: Versions of nabu-core and the agent in the release description
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.meta.outputs.tag }}
          NOTES: |
            Image: `${{ needs.meta.outputs.image }}:${{ needs.meta.outputs.tag }}` (`${{ needs.build.outputs.digest }}`), signed with cosign.
            nabu-core: ${{ needs.meta.outputs.tag }}
            Agent: Pi (@earendil-works/pi-coding-agent) ${{ needs.meta.outputs.pi_version }}
        run: |
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$TAG" -R "$GITHUB_REPOSITORY" --notes "$NOTES"
          else
            gh release create "$TAG" -R "$GITHUB_REPOSITORY" --verify-tag --title "$TAG" --notes "$NOTES"
          fi

  deploy:
    needs: [meta, scan, sandbox-images]
    if: >-
      always() && needs.meta.result == 'success' &&
      ((needs.scan.result == 'success' && needs.sandbox-images.result == 'success' && vars.AUTO_DEPLOY != 'false') ||
       needs.meta.outputs.rebuild == 'false')
    permissions: { contents: read, packages: read, id-token: write }
    uses: GreenOnGrey/nabu/.github/workflows/deploy-component.yml@v0.1.2
    with:
      component: nabu-core
      tag: ${{ needs.meta.outputs.tag }}
      run_id: ${{ inputs.run_id }}
      callback_url: ${{ inputs.callback_url }}
      environment: ${{ inputs.environment || 'production' }}
      verify_signature: ${{ needs.meta.outputs.rebuild == 'false' }}
    secrets: inherit
