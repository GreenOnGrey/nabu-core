# golangci-lint v2 (FTR.HMR.INFRA-0002: the linter in the release pipeline and on every PR).
version: "2"

linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  exclusions:
    rules:
      # Errors that are idiomatically not checked: closing resources, writing to a response
      # of HTTP and a buffer, formatted output, cleaning temporary directories;
      # apperr.Error.With changes the error in place and returns it.
      - linters: [errcheck]
        text: "Error return value of `(\\(.*\\)\\.)?([A-Za-z_][A-Za-z0-9_]*\\.)*(Close|Write|WriteByte|Flush|Fprint|Fprintf|Copy|RemoveAll|With)` is not checked"

formatters:
  enable: [gofmt]
